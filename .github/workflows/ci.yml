name: FocusFlow Backend CI

on:
  push:
    branches: [ "**" ] 
  pull_request:
    branches: [ "**" ] 

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: focusflow       
          POSTGRES_USER: postgres      
          POSTGRES_PASSWORD: password   
        ports:
          - 5432:5432 
   
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' 

      - name: Build and run tests with Maven
        working-directory: ./focusflowbackend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/focusflow
          DB_USERNAME: postgres
          DB_PASSWORD: password
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: mvn test
        
  performance-test:
    needs: build_and_test 
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: focusflow       
          POSTGRES_USER: postgres      
          POSTGRES_PASSWORD: password   
        ports:
          - 5432:5432 
   
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Application Artifact
        working-directory: ./focusflowbackend
        run: mvn clean package -DskipTests

      - name: Start Application in Background
        working-directory: ./focusflowbackend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/focusflow
          DB_USERNAME: postgres
          DB_PASSWORD: password
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          SERVER_PORT: 8080
        run: |
          echo "Starting Spring Boot application..."
          setsid mvn spring-boot:run > app.log 2>&1 &
          echo "Application started in background. PID: $!"

      - name: Wait for Application Startup
        working-directory: ./focusflowbackend
        timeout-minutes: 5
        run: |
          echo "Waiting for application to start on port 8080..."
          for i in $(seq 1 60); do
            curl -s http://localhost:8080/api/tasks > /dev/null
            if [ $? -eq 0 ]; then
              echo "Application is up!"
              exit 0
            fi
            echo "Attempt $i: Waiting..."
            sleep 1
          done
          echo "Application failed to start within timeout."
          echo "--- Application Logs ---"
          cat app.log
          echo "----------------------"
          exit 1      
      
      - name: Run Gatling constant load test
        working-directory: ./focusflowbackend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/focusflow
          DB_USERNAME: postgres
          DB_PASSWORD: password
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: mvn gatling:test -PconstantLoad-simulation
      
      - name: Upload Gatling Reports
        uses: actions/upload-artifact@v4
        with:
          name: gatling-reports-${{ github.run_id }}
          path: ./focusflowbackend/target/gatling/

